services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      # Stores settings and query logs relative to your compose file
      - ./adguard_work:/opt/adguardhome/work
      - ./adguard_conf:/opt/adguardhome/conf
    ports:
      # DNS
      - "53:53/tcp"
      - "53:53/udp"
      # DHCP (Server & Client)
      - "67:67/udp"
      - "68:68/udp"
      # HTTP, HTTPS, & Initial Setup
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "3000:3000/tcp"
      # DNS-over-TLS
      - "853:853/tcp"
      - "853:853/udp"
      # DNS-over-QUIC
      - "784:784/udp"
      # DNS-over-HTTPS (Alternative ports)
      - "8853:8853/udp"
      - "5443:5443/tcp"
      - "5443:5443/udp"
