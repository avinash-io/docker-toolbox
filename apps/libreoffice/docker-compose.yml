version: "3.8"
services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    container_name: libreoffice
    environment:
      - PID=1000
      - GID=1000
      - TZ=Etc/UTC
    volumes:
      - /path/to/your/documents:/config
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
